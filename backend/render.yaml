services:
  - type: web
    name: edupath-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: edupath-db
          property: connectionString
      - key: SECRET_KEY
        value: edupath-production-secret-key-change-in-deployment
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://edupath-silk.vercel.app,https://localhost:3000,https://localhost:5173,http://localhost:3000,http://localhost:5173
databases:
  - name: edupath-db
    databaseName: edupath
    plan: free
